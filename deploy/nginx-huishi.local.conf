server {
    listen 80;
    server_name huishi.local canvas.huishi.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name huishi.local;

    ssl_certificate /etc/ssl/huishi/huishi.local.crt;
    ssl_certificate_key /etc/ssl/huishi/huishi.local.key;

    client_max_body_size 64m;

    location /static/uploads/ {
        alias /var/lib/huishi/uploads/;
        expires 7d;
    }

    location /static/ {
        alias /opt/huishi/static/;
        expires 7d;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 240s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 240s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name canvas.huishi.local;

    ssl_certificate /etc/ssl/huishi/huishi.local.crt;
    ssl_certificate_key /etc/ssl/huishi/huishi.local.key;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors https://huishi.local" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;


    location ^~ /_next/static/ {
        alias /opt/huishi/infinite-canvas/web/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 240s;
    }
}
