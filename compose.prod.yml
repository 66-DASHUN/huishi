name: huishi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: huishi_prod
      POSTGRES_USER: huishi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huishi -d huishi_prod"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - huishi-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - huishi-internal

  backend:
    build:
      context: .
      dockerfile: deploy/container/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huishi:${POSTGRES_PASSWORD}@postgres:5432/huishi_prod
      HUISHI_DATABASE: /var/lib/huishi/huishi.sqlite3
      HUISHI_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/uploads:/var/lib/huishi/uploads
      - logs:/var/log/huishi
      - backups:/var/backups/huishi/postgres
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    networks:
      - huishi-internal

  worker:
    build:
      context: .
      dockerfile: deploy/container/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huishi:${POSTGRES_PASSWORD}@postgres:5432/huishi_prod
      HUISHI_DATABASE: /var/lib/huishi/huishi.sqlite3
      HUISHI_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/uploads:/var/lib/huishi/uploads
      - logs:/var/log/huishi
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huishi-internal

  canvas:
    build:
      context: infinite-canvas
      dockerfile: Dockerfile.huishi
      args:
        CANVAS_PARENT_ORIGINS: https://paintiworld.dashun9527.com
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    networks:
      - huishi-internal

  canvas-agent:
    build:
      context: infinite-canvas/canvas-agent
      dockerfile: Dockerfile.huishi
    restart: unless-stopped
    environment:
      HOME: /var/lib/huishi-agent
      PORT: 17371
    volumes:
      - agent-data:/var/lib/huishi-agent
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:17371/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    networks:
      - huishi-internal

volumes:
  postgres-data:
  redis-data:
  logs:
  backups:
  agent-data:

networks:
  huishi-internal:
    driver: bridge
