name: huishi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: huishi_prod
      POSTGRES_USER: huishi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huishi -d huishi_prod"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - huishi-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - huishi-internal

  backend:
    build:
      context: .
      dockerfile: deploy/container/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huishi:${POSTGRES_PASSWORD}@postgres:5432/huishi_prod
      HUISHI_DATABASE: /var/lib/huishi/huishi.sqlite3
      HUISHI_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/uploads:/var/lib/huishi/uploads
      - logs:/var/log/huishi
      - backups:/var/backups/huishi/postgres
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    networks:
      - huishi-internal

  # 生图/音频队列。并发上限 = GENERATION_IMAGE_PROCESSES × _THREADS，
  # 由 worker_supervisor.py 在容器内拉起 N 个子进程、每个进程 M 个线程。
  # **调并发只改环境变量，不要加容器**——RQ 一进程只能跑一个任务，
  # 靠加容器提到 256 并发意味着 256 个容器。
  worker-image:
    build:
      context: .
      dockerfile: deploy/container/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "worker_supervisor.py", "image"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huishi:${POSTGRES_PASSWORD}@postgres:5432/huishi_prod
      HUISHI_DATABASE: /var/lib/huishi/huishi.sqlite3
      HUISHI_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/uploads:/var/lib/huishi/uploads
      - logs:/var/log/huishi
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huishi-internal

  # 视频队列。独立于图片队列：视频单条最长占用槽位 20 分钟（轮询上游），
  # 图片只要几十秒，同队列时几条视频就能把图片生成的槽位全部占满。
  worker-video:
    build:
      context: .
      dockerfile: deploy/container/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "worker_supervisor.py", "video"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huishi:${POSTGRES_PASSWORD}@postgres:5432/huishi_prod
      HUISHI_DATABASE: /var/lib/huishi/huishi.sqlite3
      HUISHI_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/uploads:/var/lib/huishi/uploads
      - logs:/var/log/huishi
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huishi-internal

  canvas:
    build:
      context: infinite-canvas
      dockerfile: Dockerfile.huishi
      args:
        CANVAS_PARENT_ORIGINS: https://paintiworld.dashun9527.com
        # 挂在主站同域子路径下。改这里要同时改下面的 healthcheck——
        # 加了前缀之后根路径是 404，探针会一直失败。
        CANVAS_BASE_PATH: /canvas-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/canvas-app/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    networks:
      - huishi-internal

  canvas-agent:
    build:
      context: infinite-canvas/canvas-agent
      dockerfile: Dockerfile.huishi
    restart: unless-stopped
    environment:
      HOME: /var/lib/huishi-agent
      PORT: 17371
    volumes:
      - agent-data:/var/lib/huishi-agent
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:17371/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    networks:
      - huishi-internal

volumes:
  postgres-data:
  redis-data:
  logs:
  backups:
  agent-data:

networks:
  huishi-internal:
    driver: bridge
