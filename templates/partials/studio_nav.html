<aside class="studio-rail" aria-label="主导航">
  <a class="rail-logo" href="/" aria-label="绘世首页">绘</a>
  <nav class="rail-nav" aria-label="创作导航">
    <a class="rail-nav-item {{ 'is-active' if active_nav == 'generate' else '' }}" href="/workspace" title="生成">
      <span class="rail-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M6 4h8l4 4v12H6z"/><path d="M14 4v5h5"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>
      </span>
      <span>生成</span>
    </a>
    <a class="rail-nav-item {{ 'is-active' if active_nav == 'assets' else '' }}" href="/assets" title="资产">
      <span class="rail-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 15l2.6-3 2 2.3 1.4-1.6L18 17"/><circle cx="9" cy="9" r="1.2"/></svg>
      </span>
      <span>资产</span>
    </a>
  </nav>
  <div class="rail-footer">
    <details class="rail-settings">
      <summary aria-label="打开设置菜单" title="设置">
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.9-1.1L14.3 3H9.7l-.4 2.9A7 7 0 0 0 7.4 7L5 6 3 9.4l2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.1l-2 1.5 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.4 2.9h4.6l.4-2.9c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1.1z"/></svg>
        </span>
      </summary>
      <div class="rail-settings-panel">
        <a href="/account">账号</a>
        <a href="/pricing">充值</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换黑白主题">黑色主题</button>
        {% if g.user["role"] == "admin" %}
        <a href="/admin/">管理</a>
        <a href="/settings">设置</a>
        {% endif %}
      </div>
    </details>
    <a class="rail-points" href="/pricing" title="充值">{{ g.user["points"] }} 点</a>
  </div>
</aside>

<aside class="studio-sidebar" aria-label="创作入口">
  <header class="sidebar-header">
    <strong>开启创作</strong>
  </header>
  <a class="conversation-entry {{ 'is-pinned' if is_new_creation|default(false) else '' }}" href="/workspace?new=1">
    <span class="conversation-thumb" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </span>
    <span>新对话</span>
  </a>
  <div class="sidebar-section-title">历史对话</div>
  <nav class="dialogue-list" aria-label="历史对话">
    {% for dialogue in dialogues|default([]) %}
    <a class="{{ 'active' if active_dialogue and dialogue['id'] == active_dialogue['id'] and not is_new_creation|default(false) else '' }}" href="/workspace?dialogue={{ dialogue['id'] }}">
      <span>{{ dialogue["title"] }}</span>
    </a>
    {% else %}
    <span class="sidebar-empty">暂无历史对话</span>
    {% endfor %}
  </nav>
</aside>
